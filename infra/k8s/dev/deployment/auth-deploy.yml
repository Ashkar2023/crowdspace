apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    app: auth-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
    spec:
      containers:
        - name: auth-container
          image: crowdspace-auth:dev-1.0.1
          imagePullPolicy : IfNotPresent
          ports:
            - containerPort: 3030
          envFrom:
            - configMapRef:
                name: auth-configmap
          env:
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_TOKEN_SECRET